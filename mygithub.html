<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discrete Probability Distributions</title>

<style>
:root{color-scheme:light dark}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef2f7;
  color:#172033
}

.app{
  min-height:100vh;
  background:light-dark(#f7f9fc,#0f1722);
  color:light-dark(#172033,#edf3fb)
}

.header{
  background:light-dark(#ffffff,#151f2d);
  border-bottom:1px solid light-dark(#dbe2ec,#293548);
  position:sticky;
  top:0;
  z-index:10
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px;
  gap:24px
}

.brand{
  font-weight:750;
  font-size:18px;
  letter-spacing:-.2px
}

.navlinks{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.nav button{
  border:0;
  background:transparent;
  color:inherit;
  padding:9px 13px;
  border-radius:8px;
  font:inherit;
  cursor:pointer
}

.nav button:hover,
.nav button.active{
  background:light-dark(#eaf0f8,#223047);
  font-weight:650
}

main{
  max-width:1100px;
  margin:auto;
  padding:48px 24px 64px
}

.hero{
  padding:16px 0 28px
}

.eyebrow{
  text-transform:uppercase;
  font-size:12px;
  font-weight:750;
  letter-spacing:1.3px;
  color:#55709a;
  margin-bottom:10px
}

.hero h1{
  font-size:clamp(30px,5vw,48px);
  line-height:1.08;
  margin:0 0 14px;
  letter-spacing:-1.5px
}

.hero p{
  max-width:690px;
  color:light-dark(#5e6878,#aeb9c9);
  font-size:16px;
  line-height:1.65;
  margin:0
}

.card{
  background:light-dark(#fff,#172231);
  border:1px solid light-dark(#dce3ec,#2a374a);
  border-radius:14px;
  padding:24px;
  box-shadow:0 8px 25px rgba(20,35,60,.05)
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px
}

.module{
  cursor:pointer;
  transition:.18s transform,.18s border-color
}

.module:hover{
  transform:translateY(-2px);
  border-color:#8ba4c5
}

.module h2{
  margin:0 0 8px;
  font-size:19px
}

.module p{
  margin:0;
  color:light-dark(#667184,#aab6c6);
  line-height:1.55
}

.badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:4px 8px;
  border-radius:999px;
  background:light-dark(#edf2f8,#233148);
  margin-bottom:14px
}

.section-title{
  font-size:25px;
  margin:0 0 8px
}

.muted{
  color:light-dark(#667184,#aab6c6);
  line-height:1.6
}

.formula{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:light-dark(#f2f5f9,#111a27);
  padding:14px;
  border-radius:9px;
  margin:18px 0;
  font-size:14px;
  overflow:auto
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
  margin:20px 0
}

.field label{
  display:block;
  font-size:13px;
  font-weight:650;
  margin-bottom:7px
}

.field input{
  width:100%;
  padding:11px 12px;
  border:1px solid light-dark(#cdd6e2,#344257);
  border-radius:8px;
  background:light-dark(#fff,#111a27);
  color:inherit;
  font:inherit
}

.result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:18px
}

.resultbox{
  background:light-dark(#f5f7fa,#111a27);
  border:1px solid light-dark(#e0e6ee,#2c394d);
  border-radius:10px;
  padding:15px
}

.resultbox strong{
  display:block;
  font-size:22px;
  margin-top:5px
}

.statistics{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:22px
}

.stat-card{
  background:light-dark(#f5f7fa,#111a27);
  border:1px solid light-dark(#e0e6ee,#2c394d);
  border-radius:10px;
  padding:15px
}

.stat-card span{
  display:block;
  font-size:12px;
  color:light-dark(#667184,#aab6c6)
}

.stat-card strong{
  display:block;
  font-size:22px;
  margin-top:7px
}

.pmf-chart{
  position:relative;
  margin-top:22px;
  padding:24px 18px 18px;
  border:1px solid light-dark(#e0e6ee,#2c394d);
  border-radius:12px;
  background:light-dark(#f9fbfd,#111a27);
  overflow-x:auto
}

.chart-area{
  position:relative;
  min-width:720px;
  height:330px;
  margin:28px 22px 42px 52px;
  border-left:1px solid light-dark(#aeb9c9,#536277);
  border-bottom:1px solid light-dark(#aeb9c9,#536277)
}

.chart-bars{
  height:100%;
  display:flex;
  align-items:flex-end;
  gap:3px;
  padding:0 6px
}

.chart-bar{
  position:relative;
  flex:1;
  min-width:10px;
  height:var(--bar-height);
  background:#6f8fb8;
  border-radius:4px 4px 0 0;
  cursor:pointer
}

.chart-bar:hover{
  background:#55709a
}

.chart-bar::after{
  content:attr(data-tooltip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 7px);
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:7px 9px;
  border-radius:7px;
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  z-index:3
}

.chart-bar:hover::after{
  opacity:1
}

.mean-line{
  position:absolute;
  top:0;
  bottom:0;
  border-left:2px dashed #b42318;
  z-index:2;
  pointer-events:none
}

.mean-label{
  position:absolute;
  top:-27px;
  transform:translateX(-50%);
  font-size:12px;
  font-weight:700;
  color:#b42318;
  white-space:nowrap
}

.axis-label{
  position:absolute;
  font-size:12px;
  color:light-dark(#667184,#aab6c6)
}

.axis-y{
  left:-42px;
  top:50%;
  transform:rotate(-90deg) translateX(50%);
  transform-origin:center
}

.axis-x{
  bottom:-34px;
  left:50%;
  transform:translateX(-50%)
}

.x-ticks{
  position:absolute;
  left:0;
  right:0;
  bottom:-25px;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:light-dark(#667184,#aab6c6)
}

.note{
  margin-top:18px;
  font-size:13px;
  color:light-dark(#697487,#a8b4c5)
}

.error{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  font-size:13px
}

@media(max-width:900px){
  .statistics{
    grid-template-columns:repeat(3,1fr)
  }
}

@media(max-width:700px){
  .nav{
    align-items:flex-start;
    flex-direction:column
  }

  .grid,
  .controls,
  .result,
  .statistics{
    grid-template-columns:1fr
  }

  main{
    padding:32px 16px 48px
  }
}
</style>
</head>

<body>

<header class="header">

/* =========================
   BINOMIAL CALCULATION
========================= */

function updateInputs(){

const nInput=document.getElementById('n');
const pInput=document.getElementById('p');
const kInput=document.getElementById('k');

const n=Number(nInput.value);
const p=Number(pInput.value);
const k=Number(kInput.value);

const err=document.getElementById('err');

const validN=
Number.isInteger(n)&&n>0;

const validP=
Number.isFinite(p)&&p>=0&&p<=1;

const validK=
Number.isInteger(k)&&k>=0&&k<=n;


if(!validN||!validP||!validK){

let message=
'Invalid input: n must be a positive integer, p must be between 0 and 1, and k must satisfy 0 ≤ k ≤ n.';

err.innerHTML=
'<div class="error">'+message+'</div>';

document.getElementById('selectedN').textContent=
validN?n:'—';

document.getElementById('selectedP').textContent=
validP?p:'—';

document.getElementById('selectedK').textContent=
validK?k:'—';


[
'pmf',
'pmfPct',
'cdf',
'greaterThanK',
'mean',
'variance',
'stddev',
'secondMoment',
'skewness'
].forEach(id=>{
document.getElementById(id).textContent='—';
});


document.getElementById('pmfBars').innerHTML='';
document.getElementById('xTicks').innerHTML='';
document.getElementById('meanLine').style.display='none';

return;

}


err.innerHTML='';

document.getElementById('selectedN').textContent=n;
document.getElementById('selectedP').textContent=p;
document.getElementById('selectedK').textContent=k;


let combination=1;

for(let i=1;i<=k;i++){

combination*=((n-k+i)/i);

}


const pmf=
combination*
Math.pow(p,k)*
Math.pow(1-p,n-k);


document.getElementById('pmf')
.textContent=pmf.toFixed(6);

document.getElementById('pmfPct')
.textContent=(pmf*100).toFixed(3)+'%';


let cdf=0;

for(let i=0;i<=k;i++){

let c=1;

for(let j=1;j<=i;j++){

c*=((n-i+j)/j);

}

cdf+=
c*
Math.pow(p,i)*
Math.pow(1-p,n-i);

}


const greaterThanK=1-cdf;

document.getElementById('cdf')
.textContent=cdf.toFixed(6);

document.getElementById('greaterThanK')
.textContent=greaterThanK.toFixed(6);


const mean=n*p;

const variance=
n*p*(1-p);

const stddev=
Math.sqrt(variance);

const secondMoment=
variance+mean*mean;

const skewness=
variance===0
?'—'
:(1-2*p)/Math.sqrt(variance);


document.getElementById('mean')
.textContent=mean.toFixed(2);

document.getElementById('variance')
.textContent=variance.toFixed(2);

document.getElementById('stddev')
.textContent=stddev.toFixed(2);

document.getElementById('secondMoment')
.textContent=secondMoment.toFixed(2);

document.getElementById('skewness')
.textContent=
skewness==='—'
?'—'
:skewness.toFixed(3);


/* Graph */

const vals=[];
let max=0;

for(let i=0;i<=n;i++){

let c=1;

for(let j=1;j<=i;j++){

c*=((n-i+j)/j);

}

const v=
c*
Math.pow(p,i)*
Math.pow(1-p,n-i);

vals.push(v);

max=Math.max(max,v);

}


const bars=
vals.map((v,i)=>

'<div class="chart-bar" '+
'style="--bar-height:'+
(max?v/max*100:0)+
'%" '+
'data-tooltip="X = '+
i+
' | P(X='+
i+
') = '+
v.toFixed(6)+
'"></div>'

).join('');


document.getElementById('pmfBars')
.innerHTML=bars;


document.getElementById('xTicks')
.innerHTML=
vals.map((v,i)=>
'<span>'+i+'</span>'
).join('');


const meanPosition=
n===0
?0
:mean/n*100;


document.getElementById('meanLine')
.style.display='block';

document.getElementById('meanLine')
.style.left=meanPosition+'%';

document.getElementById('meanLabel')
.textContent='Mean = '+mean.toFixed(2);

}

/* =========================
   POISSON CALCULATION
========================= */

function updatePoisson(){

const input=document.getElementById('lambda');
const kInput=document.getElementById('poissonK');

const value=Number(input.value);
const k=Number(kInput.value);

const err=document.getElementById('poissonErr');

const validLambda=
Number.isFinite(value)&&value>0;

const validK=
Number.isInteger(k)&&k>=0;


if(!validLambda||!validK){

let message=
'Invalid input: λ must be a strictly positive real number (λ > 0), and k must be a non-negative integer (k ≥ 0).';

err.innerHTML=
'<div class="error">'+message+'</div>';

document.getElementById('selectedLambda')
.textContent=
validLambda?value:'—';

document.getElementById('selectedPoissonK')
.textContent=
validK?k:'—';


[
'poissonPmf',
'poissonPmfPct',
'poissonCdf',
'poissonGreaterK',
'poissonMean',
'poissonVariance',
'poissonStddev',
'poissonSecondMoment',
'poissonSkewness'
].forEach(id=>{
document.getElementById(id).textContent='—';
});


document.getElementById('poissonPmfBars')
.innerHTML='';

document.getElementById('poissonXTicks')
.innerHTML='';

document.getElementById('poissonMeanLine')
.style.display='none';

return;

}


err.innerHTML='';

document.getElementById('selectedLambda')
.textContent=value;

document.getElementById('selectedPoissonK')
.textContent=k;


let factorial=1;

for(let i=2;i<=k;i++){
factorial*=i;
}


const pmf=
Math.exp(-value)*
Math.pow(value,k)/
factorial;


document.getElementById('poissonPmf')
.textContent=pmf.toFixed(6);

document.getElementById('poissonPmfPct')
.textContent=(pmf*100).toFixed(3)+'%';


let cdf=0;

let term=Math.exp(-value);

for(let i=0;i<=k;i++){

if(i===0){
term=Math.exp(-value);
}else{
term*=value/i;
}

cdf+=term;

}


const greaterThanK=
1-cdf;


document.getElementById('poissonCdf')
.textContent=cdf.toFixed(6);

document.getElementById('poissonGreaterK')
.textContent=greaterThanK.toFixed(6);


const mean=value;

const variance=value;

const stddev=Math.sqrt(value);

const secondMoment=
value+value*value;

const skewness=
1/Math.sqrt(value);


document.getElementById('poissonMean')
.textContent=mean.toFixed(2);

document.getElementById('poissonVariance')
.textContent=variance.toFixed(2);

document.getElementById('poissonStddev')
.textContent=stddev.toFixed(2);

document.getElementById('poissonSecondMoment')
.textContent=secondMoment.toFixed(2);

document.getElementById('poissonSkewness')
.textContent=skewness.toFixed(3);


/* Graph */

const maxX=
Math.max(
15,
Math.ceil(
value+4*Math.sqrt(value)
)
);

const vals=[];

let maxProb=0;

let currentTerm=
Math.exp(-value);


for(let i=0;i<=maxX;i++){

if(i===0){
currentTerm=Math.exp(-value);
}else{
currentTerm*=value/i;
}

vals.push(currentTerm);

maxProb=
Math.max(maxProb,currentTerm);

}


document.getElementById('poissonPmfBars')
.innerHTML=
vals.map((v,i)=>

'<div class="chart-bar" '+
'style="--bar-height:'+
(maxProb?v/maxProb*100:0)+
'%" '+
'data-tooltip="X = '+
i+
' | P(X = '+
i+
') = '+
v.toFixed(6)+
'"></div>'

).join('');


document.getElementById('poissonXTicks')
.innerHTML=
vals.map((v,i)=>
'<span>'+i+'</span>'
).join('');


document.getElementById('poissonMeanLine')
.style.display='block';

document.getElementById('poissonMeanLine')
.style.left=
(value/maxX*100)+'%';

document.getElementById('poissonMeanLabel')
.textContent=
'Mean = '+value.toFixed(2);

}

content.innerHTML=`

/* =========================
   GEOMETRIC CALCULATION
========================= */

function updateGeometric(){

const input=
document.getElementById('geometricP');

const kInput=
document.getElementById('geometricK');

const value=
Number(input.value);

const k=
Number(kInput.value);

const err=
document.getElementById('geometricErr');


const validP=
Number.isFinite(value)&&
value>0&&
value<=1;

const validK=
Number.isInteger(k)&&
k>=1;


if(!validP||!validK){

err.innerHTML=
'<div class="error">'+
'Invalid input: p must satisfy 0 &lt; p ≤ 1, and k must be a positive integer (k ≥ 1).'+
'</div>';


document.getElementById('selectedGeometricP')
.textContent=
validP?value:'—';

document.getElementById('selectedGeometricK')
.textContent=
validK?k:'—';


[
'geometricPmf',
'geometricPmfPct',
'geometricCdf',
'geometricGreaterK',
'geometricMean',
'geometricVariance',
'geometricStddev',
'geometricSecondMoment',
'geometricSkewness'
].forEach(id=>{
document.getElementById(id).textContent='—';
});


document.getElementById('geometricBars')
.innerHTML='';

return;

}


err.innerHTML='';


document.getElementById('selectedGeometricP')
.textContent=value;

document.getElementById('selectedGeometricK')
.textContent=k;


const pmf=
Math.pow(1-value,k-1)*value;


document.getElementById('geometricPmf')
.textContent=
pmf.toFixed(6);

document.getElementById('geometricPmfPct')
.textContent=
(pmf*100).toFixed(3)+'%';


const cdf=
1-Math.pow(1-value,k);

const greaterThanK=
Math.pow(1-value,k);


document.getElementById('geometricCdf')
.textContent=
cdf.toFixed(6);

document.getElementById('geometricGreaterK')
.textContent=
greaterThanK.toFixed(6);


/* Statistics */

const mean=
1/value;

const variance=
(1-value)/(value*value);

const stddev=
Math.sqrt(1-value)/value;

const secondMoment=
variance+mean*mean;

const skewness=
value===1
?'—'
:(2-value)/Math.sqrt(1-value);


document.getElementById('geometricMean')
.textContent=
mean.toFixed(2);

document.getElementById('geometricVariance')
.textContent=
variance.toFixed(2);

document.getElementById('geometricStddev')
.textContent=
stddev.toFixed(3);

document.getElementById('geometricSecondMoment')
.textContent=
secondMoment.toFixed(2);

document.getElementById('geometricSkewness')
.textContent=
skewness==='—'
?'—'
:skewness.toFixed(3);


/* Geometric PMF Graph */

const maxX=
Math.min(
50,
Math.ceil(mean+4*stddev)
);

const maxP=
pmf;

const bars=
document.getElementById('geometricBars');

bars.innerHTML='';


for(let x=1;x<=maxX;x++){

const probability=
Math.pow(1-value,x-1)*value;

const bar=
document.createElement('div');

bar.className=
'chart-bar';

bar.style.height=
(
maxP>0
?
Math.max(
2,
probability/maxP*100
)
:
0
)+'%';

bar.title=
'X = '+x+
'\nP(X = '+x+') = '+
probability.toFixed(6);

bar.dataset.label=x;

bars.appendChild(bar);

}


const meanLine=
document.getElementById('geometricMeanLine');

const meanLabel=
document.getElementById('geometricMeanLabel');


meanLine.style.left=
((mean-1)/(maxX-1)*100)+'%';

meanLabel.textContent=
'Mean = '+mean.toFixed(2);

meanLabel.style.left=
((mean-1)/(maxX-1)*100)+'%';

}
